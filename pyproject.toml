[project]
name = "book-recommender"
version = "0.1.0"
description = "Semantic Book Recommender(Python, Qwen, Ollama, LangChain, Gradio)"
readme = "README.md"
authors = [
    { name = "Sandeep Bhatt", email = "sandeepika.m.204@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "deepeval>=4.2.2",
    "gradio>=6.24.0",
    "ipywidgets>=8.1.8",
    "kagglehub>=1.0.2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "matplotlib>=3.11.1",
    "notebook>=7.6.2",
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.26.0",
    "transformers>=5.15.0",
]

[project.scripts]
book-recommender = "book_recommender:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
